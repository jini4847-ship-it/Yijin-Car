<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>🚗 자동차 친구 🚗</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <h1>🚗 자동차 친구 🚗</h1>
    <p>좋아하는 자동차를 만나보세요!</p>
  </header>

  <main>

    <div class="category-buttons">
      <button onclick="showCategory('소방차')">🚒 소방차</button>
      <button onclick="showCategory('경찰차')">🚓 경찰차</button>
      <button onclick="showCategory('구급차')">🚑 구급차</button>
      <button onclick="showCategory('버스')">🚌 버스</button>
      <button onclick="showCategory('테슬라')">⚡ 테슬라</button>
      <button onclick="showCategory('페라리')">🏎️ 페라리</button>
      <button onclick="showCategory('람보르기니')">🐂 람보르기니</button>
    </div>

    <div class="car-card">

      <div class="image-area">
        <img id="carImage"
             src=""
             alt="자동차"
             onclick="speakCar()">
      </div>

      <div class="car-name" id="carName">
        자동차를 골라보세요!
      </div>

      <div class="car-category" id="carCategory"></div>

      <button class="sound-button" onclick="speakCar()">
        🔊 이름 듣기
      </button>

    </div>

    <div class="navigation">
      <button onclick="previousCar()">⬅️</button>

      <button class="random-button" onclick="randomCar()">
        🎲 랜덤 자동차
      </button>

      <button onclick="nextCar()">➡️</button>
    </div>

    <div class="counter" id="counter"></div>

  </main>

  <footer>
    🚗 자동차 친구 🚗
  </footer>

  <script src="cars.js"></script>
  <script src="script.js"></script>

</body>
</html>
