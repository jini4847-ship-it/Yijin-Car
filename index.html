<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚗 빵빵! 진짜 자동차 박물관 🚗</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'GmarketSans', sans-serif;
      background-color: #E0F7FA;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      font-size: 1.8rem;
      color: #006064;
      margin: 10px 0;
      text-align: center;
    }

    /* 상단 카테고리 필터 */
    .filter-group {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .filter-btn {
      background-color: #ffffff;
      border: 3px solid #00ACC1;
      color: #00838F;
      font-size: 1rem;
      font-weight: bold;
      padding: 8px 14px;
      border-radius: 20px;
      cursor: pointer;
    }

    .filter-btn.active {
      background-color: #00ACC1;
      color: white;
    }

    /* 대표 큰 사진 카드 */
    .main-card {
      width: 100%;
      max-width: 400px;
      height: 280px;
      background: white;
      border: 6px solid #FFB300;
      border-radius: 20px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      cursor: pointer;
      user-select: none;
    }

    .main-card:active {
      transform: scale(0.98);
    }

    .main-card img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 12px;
    }

    .car-title {
      font-size: 1.8rem;
      font-weight: bold;
      color: #D84315;
      margin-top: 4px;
    }

    /* 차종 선택 그리드 */
    .car-select-grid {
      width: 100%;
      max-width: 400px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 15px;
    }

    .car-select-btn {
      background: white;
      border: 2px solid #B2EBF2;
      border-radius: 12px;
      padding: 6px 2px;
      text-align: center;
      font-weight: bold;
      font-size: 0.85rem;
      color: #333;
      cursor: pointer;
    }

    .car-select-btn.active {
      border-color: #FF5722;
      background-color: #FFCCBC;
      color: #D84315;
    }

    /* 10장 이상 사진 갤러리 영역 */
    .section-title {
      width: 100%;
      max-width: 400px;
      margin-top: 20px;
      margin-bottom: 8px;
      font-size: 1.2rem;
      color: #00838F;
      font-weight: bold;
    }

    .gallery-grid {
      width: 100%;
      max-width: 400px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 30px;
    }

    .gallery-item {
      background: white;
      border: 3px solid #FFF;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      cursor: pointer;
    }

    .gallery-item img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body>

  <h1>🚗 빵빵! 진짜 자동차 박물관 🚗</h1>

  <!-- 카테고리 필터 -->
  <div class="filter-group">
    <button class="filter-btn active" onclick="filterCategory('all', this)">전체보기</button>
    <button class="filter-btn" onclick="filterCategory('work', this)">일하는 차</button>
    <button class="filter-btn" onclick="filterCategory('bus', this)">버스/승용차</button>
    <button class="filter-btn" onclick="filterCategory('super', this)">슈퍼카</button>
  </div>

  <!-- 메인 큰 카드 -->
  <div class="main-card" onclick="speakCurrentCar()">
    <img id="main-img" src="" alt="자동차 사진">
    <div class="car-title" id="main-title">소방차</div>
  </div>

  <!-- 차종 선택 버튼들 -->
  <div class="car-select-grid" id="car-select-grid"></div>

    let currentCar = carData[0];
    let currentFilter = 'all';

    function init() {
      selectCar(carData[0], false);
    }

    // 자동차 선택 시 메인 카드와 10장 갤러리 갱신
    function selectCar(car, shouldSpeak = true) {
      currentCar = car;
      
      // 메인 카드 갱신 (첫 번째 대표 사진)
      document.getElementById('main-img').src = car.images[0];
      document.getElementById('main-title').textContent = car.name;
      document.getElementById('gallery-title').textContent = `📸 ${car.name} 사진 (10장)`;

      // 차종 선택 버튼 하이라이트
      renderCarSelectButtons();

      // 갤러리 렌더링
      renderGallery(car);

      if (shouldSpeak) {
        speak(car.desc);
      }
    }

    // 차종 버튼 목록 렌더링
    function renderCarSelectButtons() {
      const grid = document.getElementById('car-select-grid');
      grid.innerHTML = '';

      const filtered = currentFilter === 'all' 
        ? carData 
        : carData.filter(c => c.category === currentFilter);

      filtered.forEach(car => {
        const btn = document.createElement('div');
        btn.className = `car-select-btn ${car.id === currentCar.id ? 'active' : ''}`;
        btn.textContent = car.name;
        btn.onclick = () => selectCar(car, true);
        grid.appendChild(btn);
      });
    }

    // 10장 이상의 갤러리 렌더링
    function renderGallery(car) {
      const gallery = document.getElementById('gallery-grid');
      gallery.innerHTML = '';

      car.images.forEach((imgUrl, index) => {
        const item = document.createElement('div');
        item.className = 'gallery-item';
        
        // 갤러리 사진을 누르면 해당 사진이 대표 큰 사진으로 변경됨
        item.onclick = () => {
          document.getElementById('main-img').src = imgUrl;
          speak(`${car.name} ${index + 1}번 사진!`);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        item.innerHTML = `<img src="${imgUrl}" alt="${car.name} ${index + 1}">`;
        gallery.appendChild(item);
      });
    }

    // 카테고리 필터
    function filterCategory(category, btnElement) {
      currentFilter = category;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');

      const filtered = currentFilter === 'all' 
        ? carData 
        : carData.filter(c => c.category === currentFilter);

      if (filtered.length > 0) {
        selectCar(filtered[0], true);
      } else {
        renderCarSelectButtons();
      }
    }

    function speakCurrentCar() {
      speak(currentCar.desc);
    }

    // 음성 재생 (TTS)
    function speak(text) {
      try {
        if ('speechSynthesis' in window) {
          window.speechSynthesis.cancel();
          const speech = new SpeechSynthesisUtterance(text);
          speech.lang = 'ko-KR';
          speech.rate = 0.9;
          speech.pitch = 1.2;
          window.speechSynthesis.speak(speech);
        }
      } catch (e) {
        console.log("TTS Error:", e);
      }
    }

    window.onload = init;

</body>
</html>
