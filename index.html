<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🚗 빵빵! 진짜 자동차 박물관 🚗</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: 'GmarketSans', sans-serif;
      background-color: #E0F7FA;
      margin: 0;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      font-size: 1.8rem;
      color: #006064;
      margin: 10px 0;
      text-align: center;
    }

    /* 카테고리 필터 버튼 */
    .filter-group {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .filter-btn {
      background-color: #ffffff;
      border: 3px solid #00ACC1;
      color: #00838F;
      font-size: 1.1rem;
      font-weight: bold;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
    }

    .filter-btn.active {
      background-color: #00ACC1;
      color: white;
    }

    /* 메인 전시 카드 (터치하면 소리남) */
    .main-card {
      width: 100%;
      max-width: 360px;
      height: 320px;
      background: white;
      border: 6px solid #FFB300;
      border-radius: 25px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 15px;
      cursor: pointer;
      transition: transform 0.1s;
      overflow: hidden;
    }

    .main-card:active {
      transform: scale(0.96);
    }

    .main-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 15px;
    }

    .car-title {
      font-size: 2rem;
      font-weight: bold;
      color: #D84315;
      margin-top: 5px;
    }

    /* 자동차 그리드 선택창 */
    .grid-container {
      width: 100%;
      max-width: 360px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    .thumb-card {
      background: white;
      border: 3px solid #B2EBF2;
      border-radius: 15px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    .thumb-card.active {
      border-color: #FF5722;
      background-color: #FBE9E7;
    }

    .thumb-card img {
      width: 100%;
      height: 65px;
      object-fit: cover;
      border-radius: 8px;
    }

    .thumb-card span {
      font-size: 0.85rem;
      font-weight: bold;
      margin-top: 5px;
      color: #333;
    }
  </style>
</head>
<body>

  <h1>🚗 빵빵! 진짜 자동차 박물관 🚗</h1>

  <!-- 카테고리 필터 -->
  <div class="filter-group">
    <button class="filter-btn active" onclick="filterCategory('all', this)">전체보기</button>
    <button class="filter-btn" onclick="filterCategory('work', this)">일하는 차</button>
    <button class="filter-btn" onclick="filterCategory('bus', this)">버스/승용차</button>
    <button class="filter-btn" onclick="filterCategory('super', this)">슈퍼카</button>
  </div>

  <!-- 큰 카드 (메인 실물 사진) -->
  <div class="main-card" onclick="speakCurrentCar()">
    <img id="main-img" src="" alt="자동차 사진">
    <div class="car-title" id="main-title"></div>
  </div>

  <!-- 작은 사진 목록 -->
  <div class="grid-container" id="grid"></div>

  <script>
    // 자동차 실물 고화질 사진 데이터
    const cars = [
      // 일하는 차
      { 
        id: 1, 
        category: 'work', 
        name: "소방차", 
        desc: "삐뽀삐뽀! 불을 끄는 빨간 소방차!", 
        img: "https://images.unsplash.com/photo-1583863788434-e58a36330cf0?auto=format&fit=crop&w=600&q=80" 
      },
      { 
        id: 2, 
        category: 'work', 
        name: "덤프트럭", 
        desc: "쿵쾅쿵쾅! 흙을 가득 나르는 덤프트럭!", 
        img: "https://images.unsplash.com/photo-1519003722824-194d4455a60c?auto=format&fit=crop&w=600&q=80" 
      },
      
      // 버스 / 일반차
      { 
        id: 3, 
        category: 'bus', 
        name: "버스", 
        desc: "부르릉! 손님을 많이 태우는 버스!", 
        img: "https://images.unsplash.com/photo-1570125909232-eb263c188f7e?auto=format&fit=crop&w=600&q=80" 
      },
      { 
        id: 4, 
        category: 'bus', 
        name: "타요 버스", 
        desc: "안녕! 귀여운 파란색 타요 꼬마버스!", 
        img: "https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?auto=format&fit=crop&w=600&q=80" 
      },
      { 
        id: 5, 
        category: 'bus', 
        name: "테슬라", 
        desc: "스윽~ 소리 없이 빠르게 달리는 전기차 테슬라!", 
        img: "https://images.unsplash.com/photo-1560958089-b8a1929cea89?auto=format&fit=crop&w=600&q=80" 
      },

      // 스포츠카 / 슈퍼카
      { 
        id: 6, 
        category: 'super', 
        name: "스포츠카", 
        desc: "쌩쌩! 도로를 신나게 달리는 스포츠카!", 
        img: "https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=600&q=80" 
      },
      { 
        id: 7, 
        category: 'super', 
        name: "페라리", 
        desc: "쿠앙! 정말 빠르게 달리는 빨간색 페라리!", 
        img: "https://images.unsplash.com/photo-1583121274602-3e2820c69888?auto=format&fit=crop&w=600&q=80" 
      },
      { 
        id: 8, 
        category: 'super', 
        name: "람보르기니", 
        desc: "콰아앙! 황소처럼 멋지고 강한 람보르기니!", 
        img: "https://images.unsplash.com/photo-1511919884226-fd3cad34687c?auto=format&fit=crop&w=600&q=80" 
      }
    ];

    let currentCar = cars[0];
    let currentFilter = 'all';

    function init() {
      selectCar(cars[0]);
      renderGrid();
    }

    function selectCar(car) {
      currentCar = car;
      document.getElementById('main-img').src = car.img;
      document.getElementById('main-title').textContent = car.name;
      
      speak(car.desc);
      renderGrid();
    }

    function renderGrid() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      const filteredCars = currentFilter === 'all' 
        ? cars 
        : cars.filter(c => c.category === currentFilter);

      filteredCars.forEach(car => {
        const thumb = document.createElement('div');
        thumb.className = `thumb-card ${car.id === currentCar.id ? 'active' : ''}`;
        thumb.onclick = () => selectCar(car);

        thumb.innerHTML = `
          <img src="${car.img}" alt="${car.name}">
          <span>${car.name}</span>
        `;
        grid.appendChild(thumb);
      });
    }

    function filterCategory(category, btn) {
      currentFilter = category;
      
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      renderGrid();
    }

    function speakCurrentCar() {
      speak(currentCar.desc);
    }

    function speak(text) {
      window.speechSynthesis.cancel();
      const speech = new SpeechSynthesisUtterance(text);
      speech.lang = 'ko-KR';
      speech.rate = 0.9;
      speech.pitch = 1.2;
      window.speechSynthesis.speak(speech);
    }

    window.onload = init;
  </script>
</body>
</html>
