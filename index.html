<!DOCTYPE html>
<html lang="ko">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <title>🚗 자동차 친구 🚗</title>

  <link rel="stylesheet" href="style.css">

</head>


<body>


  <!-- =====================================
       홈 화면
  ====================================== -->

  <div id="homeScreen" class="screen">

    <div class="home-header">

      <h1>🚗 자동차 친구 🚗</h1>

      <p>
        보고 싶은 자동차를 눌러보세요!
      </p>

    </div>


    <div id="categoryGrid" class="category-grid">


      <button
        class="category-card"
        data-category="소방차"
      >
        <div class="category-emoji">
          🚒
        </div>

        <div class="category-name">
          소방차
        </div>
      </button>


      <button
        class="category-card"
        data-category="경찰차"
      >
        <div class="category-emoji">
          🚓
        </div>

        <div class="category-name">
          경찰차
        </div>
      </button>


      <button
        class="category-card"
        data-category="구급차"
      >
        <div class="category-emoji">
          🚑
        </div>

        <div class="category-name">
          구급차
        </div>
      </button>


      <button
        class="category-card"
        data-category="버스"
      >
        <div class="category-emoji">
          🚌
        </div>

        <div class="category-name">
          버스
        </div>
      </button>


      <button
        class="category-card"
        data-category="테슬라"
      >
        <div class="category-emoji">
          ⚡
        </div>

        <div class="category-name">
          테슬라
        </div>
      </button>


      <button
        class="category-card"
        data-category="사이버트럭"
      >
        <div class="category-emoji">
          🛻
        </div>

        <div class="category-name">
          사이버트럭
        </div>
      </button>


      <button
        class="category-card"
        data-category="페라리"
      >
        <div class="category-emoji">
          🏎️
        </div>

        <div class="category-name">
          페라리
        </div>
      </button>


      <button
        class="category-card"
        data-category="람보르기니"
      >
        <div class="category-emoji">
          🐂
        </div>

        <div class="category-name">
          람보르기니
        </div>
      </button>


      <button
        class="category-card"
        data-category="덤프트럭"
      >
        <div class="category-emoji">
          🚛
        </div>

        <div class="category-name">
          덤프트럭
        </div>
      </button>


      <!-- 반드시 마지막 -->

      <button
        class="category-card"
        data-category="다른 자동차"
      >
        <div class="category-emoji">
          🚘
        </div>

        <div class="category-name">
          다른 자동차
        </div>
      </button>


    </div>

  </div>



  <!-- =====================================
       갤러리 화면
  ====================================== -->

  <div
    id="galleryScreen"
    class="screen gallery-screen"
  >


    <!-- 상단 -->

    <div class="gallery-header">


      <button
        id="backButton"
        class="back-button"
      >
        ← 뒤로
      </button>


      <div class="gallery-title-area">

        <h2 id="galleryTitle">
          자동차
        </h2>

        <p id="gallerySubtitle">
          멋진 자동차를 찾아볼까요?
        </p>

      </div>


    </div>



    <!-- 로딩 -->

    <div
      id="loading"
      class="loading"
    >
      🚗 자동차 사진을 찾고 있어요...
    </div>



    <!-- 사진 -->

    <div
      id="photoBox"
      class="photo-box"
    >


      <img
        id="carImage"
        src=""
        alt="자동차 사진"
      >


      <div
        id="emojiBox"
        class="emoji-box"
      >
        🚗
      </div>


      <div class="photo-info">

        <div
          id="carName"
          class="car-name"
        >
          자동차
        </div>


        <div
          id="carCategory"
          class="car-category"
        >
          자동차
        </div>

      </div>


    </div>



    <div
      id="photoHint"
      class="photo-hint"
    >
      사진을 눌러보세요! 🔊
    </div>



    <button
      id="speakButton"
      class="speak-button"
    >
      🔊 자동차 이름 듣기
    </button>



    <div
      id="credit"
      class="credit"
    ></div>



    <div
      id="error"
      class="error"
    ></div>



    <!-- 이전 / 다음 -->

    <div class="navigation">


      <button
        id="prevButton"
        class="nav-button"
      >
        ◀
      </button>


      <div
        id="counter"
        class="counter"
      >
        0 / 0
      </div>


      <button
        id="nextButton"
        class="nav-button"
      >
        ▶
      </button>


    </div>


  </div>



  <!-- =====================================
       JS
  ====================================== -->

  <script src="config.js"></script>

  <script src="cars.js"></script>

  <script src="script.js"></script>


</body>

</html>
